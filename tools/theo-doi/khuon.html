<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theo dõi __EP__</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mu:#6b6a64;--line:#dcdad2;--card:#fff;--ok:#2f7d4f;--bad:#b3392f;--acc:#2a5db0}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a18;--fg:#ecebe5;--mu:#9b9a92;--line:#3a3935;--card:#242422;--ok:#6cc08b;--bad:#ef7b70;--acc:#7aa7ee}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mu);margin-bottom:16px}
.the{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.the div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:92px}
.the b{display:block;font-size:18px}
.the span{color:var(--mu);font-size:12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mu)}
td.loi-text{white-space:normal;min-width:200px;max-width:340px}
td.buoc{text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
a{color:var(--acc);text-decoration:none;margin:0 2px}a:hover{text-decoration:underline}
tr.coloi{background:color-mix(in srgb,var(--bad) 8%,transparent)}
</style>
</head>
<body>
<h1>Theo dõi __EP__</h1>
<div class="sub">Cập nhật __CAPNHAT__ · trang offline, ảnh mở từ thư mục output</div>
<div class="the">__DAUTRANG__</div>
<div class="wrap"><table>
<thead><tr><th>Shot</th><th>Câu lời kể</th><th>Loại</th><th>Giây</th>__COT__</tr></thead>
<tbody>
__BANG__
</tbody></table></div>
</body>
</html>
