<!doctype html>
<!-- Trang thử R15 độc lập (đi kèm docs/ban-giao-r15.md): chỉ cần r15.js + three từ CDN. Không cần texture/GLB.
     Mở qua máy chủ tĩnh (vd: npx serve .) rồi vào /docs/ban-giao-r15-demo.html. ?r15=<đường dẫn r15.js> để đổi chỗ file. -->
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R15 demo</title>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #20242c; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
  select, button, label { background: #2f3542; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 4px 8px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <select id="anim"></select><select id="face"></select>
  <label><input type="checkbox" id="close"> cận mặt</label>
  <label><input type="checkbox" id="play" checked> chạy</label>
  <input type="range" id="t" min="0" max="10" step="0.01" value="0" style="width:180px">
</div>
<script type="module">
import * as THREE from 'three';
const src = new URLSearchParams(location.search).get('r15') || '../engine/r15.js';
const { createR15, R15_FACES, FACE_PRESETS, R15_ANIMATIONS } = await import(src);
window.THREE = THREE;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fc7e8');
scene.add(new THREE.HemisphereLight('#ffffff', '#6b7a5a', 1.4));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(6, 12, 8); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: '#7fb069' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);

const hero = createR15(THREE, { name: 'hero', shirt: '#2d6cdf', pants: '#2c3e50', hat: 'beanie', hatColor: '#c0392b', face: 'smile' });
scene.add(hero.root);

const $ = (id) => document.getElementById(id);
for (const n of Object.keys(R15_ANIMATIONS)) $('anim').add(new Option(n, n));
for (const n of Object.keys(FACE_PRESETS)) $('face').add(new Option(n, n));
$('anim').value = 'idle';
$('face').onchange = () => hero.setFace($('face').value);

// Hàm thuần của t — dùng được cho render từng khung (window.renderAt) lẫn xem trực tiếp
function renderAt(t, anim = $('anim').value, face = null) {
  if (face) { $('face').value = face; hero.setFace(face); }
  hero.animate(anim, t);
  const close = $('close').checked;
  const fc = new THREE.Vector3(...hero.faceCenter); hero.parts.head.localToWorld(fc);
  if (close) { camera.position.set(fc.x, fc.y + 0.1, fc.z + 4.2); camera.lookAt(fc); }
  else { camera.position.set(5, 4.2, 13); camera.lookAt(0, 2.6, 0); }
  renderer.render(scene, camera);
}
window.renderAt = renderAt; window.hero = hero; window.R15_FACES = R15_FACES; window.R15_ANIMATIONS = R15_ANIMATIONS;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
$('t').oninput = () => { $('play').checked = false; renderAt(+$('t').value); };
// Vòng lặp chỉ để XEM trực tiếp; chuyển động vẫn là hàm của t
const t0 = performance.now();
(function loop() { if ($('play').checked) { const t = ((performance.now() - t0) / 1000) % 10; $('t').value = t; renderAt(t); } requestAnimationFrame(loop); })();
window.__ready = true;
</script>
</body>
</html>
