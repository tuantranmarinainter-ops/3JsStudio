<!doctype html>
<!-- TẬP MẪU — composition tổng 1080×1920, 30 fps. tools/storyboard.py chép file này sang episodes/<ep>/ và thay
     "/episodes/_template/" + thời lượng. Dựng từ ep001/index.html, bỏ phần riêng của ep001 (nhà biết đi, bưu thiếp, nhiều giọng).
     Shot ngắn theo LOẠI (engine/shottypes.js) → expandShots() → đạo diễn engine/shots.js. Thị trấn: engine/town.js (env "kenneyTown").
     Xem nhanh:  node tools/look.mjs episodes/_template/index.html --shots all
     Render dự phòng: npx hyperframes render . -c episodes/_template/index.html -o output/_template.mp4 -->
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>tap-mau</title>
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
    <style>
      @font-face { font-family: 'Be Vietnam Pro'; font-weight: 900; font-style: normal; src: url('/assets/fonts/BeVietnamPro-Black.ttf') format('truetype'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #cap, #title {
        position: absolute; left: 40px; right: 40px; text-align: center;
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; line-height: 1.12; color: #fff;
        -webkit-text-stroke: 14px #15121c; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,0.35);
      }
      #cap { top: 1250px; font-size: 84px; transform-origin: 50% 60%; }
      #title { top: 260px; font-size: 104px; color: #ffe066; transform-origin: 50% 50%; }   /* chữ nổi đặc biệt: trường `text` của shot */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.7" data-width="1080" data-height="1920" data-fps="30">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="title" class="clip" data-start="0" data-duration="17.7" data-track-index="1"></div>
      <div id="cap" class="clip" data-start="0" data-duration="17.7" data-track-index="2"></div>
      <audio id="narration" class="clip" src="narration.mp3" data-start="0" data-track-index="3" data-volume="1" data-lang="vi"></audio>
      <audio id="sfx_khoanh-khac" class="clip" src="sfx_khoanh-khac.ogg" data-start="0" data-track-index="4" data-volume="1" data-sfx-layer="khoanh-khac" data-label="Tiếng động theo cảnh"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { createStage } from '/engine/stage.js';
      import { propKit } from '/engine/props.js';
      import { createEnvs, ENV_ASSETS } from '/engine/envs.js';
      import { createAssetLib } from '/engine/assets.js';
      import { buildTimeline } from '/engine/timeline.js';
      import { createDirector } from '/engine/shots.js';
      import { expandShots, resolvePlaces } from '/engine/shottypes.js';
      import { buildTown, TOWN_ASSETS, registerTownEnv } from '/engine/town.js';
      import { buildCast, crowdNames } from '/engine/cast.js';
      import { createPost, FX_DEFAULTS, FX_LABELS } from '/engine/post.js';
      import { EPISODE } from '/episodes/_template/episode.js';
      import { SHOTS } from '/episodes/_template/shots.js';
      import { CAPTIONS } from '/episodes/_template/captions.js';

      await document.fonts.load("900 84px 'Be Vietnam Pro'", 'Việt ữ ầ ặ').catch(() => {});
      const q = new URLSearchParams(location.search);
      const OPTS = { lang: 'vi', subs: q.get('subs') !== '0', voice: q.get('voice') !== '0' };
      const FPS = EPISODE.fps || 30;
      const stage = createStage(THREE, { canvas: document.getElementById('stage'), ground: null, fov: 40 });
      const K = propKit(THREE);
      const A = createAssetLib(THREE);
      await A.load([...ENV_ASSETS, ...TOWN_ASSETS]);          // tải hết GLB trước khi seek
      const envs = createEnvs(THREE, stage, K, A);
      const town = buildTown(THREE, A, { seed: EPISODE.seed ?? 1, ...(EPISODE.town || {}) });
      registerTownEnv(envs, stage, town, { name: 'kenneyTown', light: EPISODE.light || 'day' });
      const places = resolvePlaces(EPISODE.places, town.places);
      const actors = await buildCast(THREE, EPISODE.actors, { seed: EPISODE.seed ?? 1 });
      for (const a of Object.values(actors)) stage.scene.add(a.root);
      // shot ngắn theo loại → cam/cast đầy đủ (liên tục địa điểm + vị trí diễn viên giữa các shot)
      const shots = expandShots(SHOTS, { places, crowd: crowdNames(EPISODE.actors), env: EPISODE.env || 'kenneyTown', light: EPISODE.light, fps: FPS });
      const tl = buildTimeline(shots, FPS);
      const director = createDirector({ THREE, stage, envs, K, actors, houses: {}, props: {}, fx: {} });
      const post = createPost(THREE, stage, { actors: Object.values(actors).map((a) => a.root) });
      if (q.get('fx') !== null) { const on = new Set(q.get('fx').split(',')); post.set(Object.fromEntries(Object.keys(FX_DEFAULTS).map((k) => [k, on.has(k)]))); }
      stage.draw = (t) => post.render({ t, ...envs.last, focus: stage.target });
      window.__post = post;

      // phụ đề (captions.js: [t0, t1, chữ]) + chữ nổi của shot (trường text), bật nảy 0.12 s
      const cap = document.getElementById('cap'), title = document.getElementById('title');
      let lastCap = -1, lastTitle = null;
      const pop = (k) => `scale(${0.82 + 0.18 * (1 - Math.pow(1 - Math.min(1, k), 3))})`;
      function overlay(t, shot, local) {
        const L = OPTS.subs ? CAPTIONS : [];
        let i = -1; for (let j = 0; j < L.length; j++) { if (L[j][0] <= t + 1e-4 && t < L[j][1]) { i = j; break; } }
        if (i !== lastCap) { cap.textContent = i >= 0 ? L[i][2] : ''; lastCap = i; }
        cap.style.transform = pop(i >= 0 ? (t - L[i][0]) / 0.12 : 1);
        const txt = shot.text || '';
        if (txt !== lastTitle) { title.textContent = txt; lastTitle = txt; }
        title.style.transform = pop(local / 0.15);
      }

      stage.onFrame((t) => {
        const T = Math.min(t, tl.total - 1e-4);
        const { shot, local, k } = tl.at(T);
        director.render(shot, local, k, T);
        overlay(T, shot, local);
      });
      for (const e of Object.values(envs.envs)) e.group.visible = true;
      stage.renderer.compile(stage.scene, stage.camera);
      for (const e of Object.values(envs.envs)) e.group.visible = false;
      stage.start();
      window.renderAt = (t) => stage.renderAt(t);
      window.__shots = tl;
      window.__stage = stage;
      window.__places = places;
      window.getOptions = () => ({ ...OPTS, vid: {}, voices: [], fx: post.options, fxLabels: FX_LABELS });
      window.setOptions = (o = {}) => {
        if (o.subs !== undefined) OPTS.subs = !!o.subs;
        if (o.voice !== undefined) OPTS.voice = !!o.voice;
        if (o.fx) post.set(o.fx);
        lastCap = -2;
        for (const a of document.querySelectorAll('audio[data-lang]')) a.dataset.volume = OPTS.voice ? '1' : '0';
        return window.getOptions();
      };
      window.setOptions({});
      window.__ready = true;
    </script>
  </body>
</html>
