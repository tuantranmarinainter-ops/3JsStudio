<!doctype html>
<!-- Trang thử asset: ?view=house|chars&t=1.5&cam=x,y,z&look=x,y,z  (chụp bằng tools/peek.mjs) -->
<html><head><meta charset="UTF-8"><title>lab</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { createStage } from '../../engine/stage.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'house';
const stage = createStage(THREE, { canvas: document.getElementById('c') });
const mod = await import(`./views/${view}.js`);
const fn = await mod.default(THREE, stage, q);
stage.onFrame((t) => fn(t));
const num = (s) => s.split(',').map(Number);
window.renderAt = (t) => {
  stage.renderAt(t);
  if (q.get('cam')) { stage.setCamera(num(q.get('cam')), num(q.get('look') || '0,0,0'), { fov: +(q.get('fov') || 40) }); stage.renderer.render(stage.scene, stage.camera); }
};
window.renderAt(+(q.get('t') || 0));
window.__ready = true;
</script></body></html>
