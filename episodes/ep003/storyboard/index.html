e": "máy: Trung cận đôi 50 mm nhìn ngang dọc bậc hiên, một vai Gà cao ở trái và gương mặt thị trưởng thấp ở phải.; diễn: Thị trưởng dừng lại, cúi người lấy hơi rồi chỉ vào túi áo, còn Gà cúi đầu lắng nghe. Nhịp chuyển từ chạy sang đứng yên.; Người cần giúp đã đổi vai · set:street", "text": "", "line": "Sáng hôm sau, chính chú chạy qua tìm tôi."}, {"id": "s074", "t0": 106.498, "t1": 107.853, "img": "s074.jpg", "type": "reaction", "note": "máy: Đặc tả 85 mm chếch xuống túi áo thị trưởng, máy tĩnh, vân vải sắc nét. Hồi tưởng vật thể rất ngắn cùng trục với shot sau.; diễn: Trong hình ảnh hồi tưởng theo lời kể, đồng hồ quả quýt nắp vàng và dây xích ngắn hiện trên bàn tay thị trưởng ngay trước túi áo. Một rãnh viền tròn giúp nhận ra vật về sau.; Chiếc đồng hồ cha để lại · set:street", "text": "", "line": "Chiếc đồng hồ quả quýt cha để lại cho chú đã biến mất."}, {"id": "s075", "t0": 107.853, "t1": 109.253, "img": "s075.jpg", "type": "reaction", "note": "máy: Đặc tả 85 mm cùng hướng, chiều cao và điểm nét với S074, sau đó có thể dịch nét từ mép túi sang bàn tay trống.; diễn: Trở về hiện tại, thị trưởng vén miệng túi áo trống ra. Giữ đường may túi tại đúng vị trí của S074 để khán giả đọc ra sự biến mất ngay khi cắt.; Túi trống · set:street", "text": "", "line": "Chiếc đồng hồ quả quýt cha để lại cho chú đã biến mất."}, {"id": "s076", "t0": 109.253, "t1": 110.616, "img": "s076.jpg", "type": "chase", "note": "máy: Trung toàn 35 mm từ dưới mép hiên, hướng máy chéo ra đường, thấy đội hình theo ba lớp.; diễn: Thị trưởng giơ tay gọi ở tiền cảnh. Hai lính gác quay cùng hướng nhìn từ phía vỉa hè, Gà chờ cạnh cửa nhà và chuẩn bị dẫn đi.; Gọi hai lính gác · set:street", "text": "", "line": "Lần này, chú gọi hai lính gác đi cùng tôi."}, {"id": "s077", "t0": 110.616, "t1": 111.945, "img": "s077.jpg", "type": "reaction", "note": "máy: Toàn 32 mm nhìn từ sau đoàn ở mép vỉa hè, máy theo nhẹ ngang tầm lưng Gà, dùng đường dẫn dọc chiều sâu phố.; diễn: Gà dẫn đầu về nhà máy, thị trưởng đi sát theo, hai lính gác nối sau. Hướng đi ổn định theo trục phố đã thiết lập ở cuộc bám đuôi đêm hai.; Gà dẫn cả nhóm · set:street", "text": "", "line": "Lần này, chú gọi hai lính gác đi cùng tôi."}, {"id": "s078", "t0": 111.945, "t1": 113.303, "img": "s078.jpg", "type": "reaction", "note": "máy: Trung toàn 35 mm chếch từ ngoài tường nhà máy dọc mặt kính, đặt máy cùng mặt tường với chỗ Gà từng rình.; diễn: Thị trưởng tiến sát kính để nhìn, Gà chỉ nhẹ vào phía trong. Hai lính gác lùi một bước chừa đường quan sát. Thùng gỗ cũ vẫn ở chân cửa kính.; Cùng nhìn qua cửa kính · set:factory-exterior", "text": "", "line": "Qua cửa kính nhà máy, chú thấy ông Bách nhặt chiếc đồng hồ của mình khỏi băng chuyền."}, {"id": "s079", "t0": 113.303, "t1": 114.774, "img": "s079.jpg", "type": "closeup", "note": "máy: Trung cận 50 mm từ phía trong, trục dọc băng chuyền, mép kính xa mờ phía sau. Góc thấp sát mặt băng, lấy nét vào tay và vật chứng.; diễn: Ông Bách nhấc đồng hồ quả quýt nắp vàng khỏi đầu nhận băng chuyền. Dây xích ngắn thõng xuống trên băng. Bách nhìn vật trong tay, chưa biết có người bên cửa kính.; Ông Bách nhặt đúng chiếc đồng hồ · set:factory-interior", "text": "", "line": "Qua cửa kính nhà máy, chú thấy ông Bách nhặt chiếc đồng hồ của mình khỏi băng chuyền."}, {"id": "s080", "t0": 114.774, "t1": 116.11, "img": "s080.jpg", "type": "insert", "note": "máy: Cận đôi 65 mm ngoài cửa kính, ngang mắt thị trưởng. Máy ở cùng phía tường như S078, kính và ánh mắt tạo một đường chéo.; diễn: Thị trưởng mở to mắt khi thấy đồng hồ. Gà sau vai chú im lặng, nhìn từ vật chứng sang chú. Giữ nhịp ngắn để phản ứng lên trước mệnh lệnh.; Thị trưởng nhận ra vật chứng · set:factory-exterior", "text": "", "line": "Qua cửa kính nhà máy, chú thấy ông Bách nhặt chiếc đồng hồ của mình khỏi băng chuyền."}, {"id": "s081", "t0": 116.11, "t1": 117.658, "img": "s081.jpg", "type": "reaction", "note": "máy: Trung toàn 35 mm chếch từ đầu hồi phía nam, thấy ô kính phía tây và hướng thị trưởng ra hiệu vòng sang ph   const img = document.getElementById('img'), none = document.getElementById('none'), info = document.getElementById('info');
  const esc = (s) => String(s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  window.__shots = { list: SHOTS, total: TOTAL };
  window.renderAt = async (t) => {
    const s = SHOTS.find((x) => t >= x.t0 && t < x.t1) || SHOTS[SHOTS.length - 1];
    if (s.img) { const u = new URL(s.img, location.href).href; if (img.src !== u) { img.src = u; } await img.decode().catch(() => {}); img.style.display = ''; none.style.display = 'none'; }
    else { img.style.display = 'none'; none.style.display = 'flex'; }
    info.innerHTML = `<b>${esc(s.id)} · ${esc(s.type)}</b><br>${esc(s.line)}${s.text ? '<br>Chữ: ' + esc(s.text) : ''}${s.note ? '<br><i>' + esc(s.note) + '</i>' : ''}`;
  };
  document.fonts.load("900 48px 'Be Vietnam Pro'").finally(() => window.renderAt(0).then(() => { window.__ready = true; }));
