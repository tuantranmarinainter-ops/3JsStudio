<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sway Lab</title>
<style>
  :root { --bg:#0e1118; --panel:rgba(14,17,24,.86); --ink:#e8eef6; --mute:#9aa8bb; --line:#2a3344; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  #c { display:block; margin:0 auto; height:100vh; width:auto; aspect-ratio:9/16; max-width:100vw; }
  #ui { position:fixed; left:8px; right:8px; bottom:8px; max-width:460px; margin:0 auto; background:var(--panel); border:1px solid var(--line);
        border-radius:10px; padding:8px 10px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 8px; align-items:center; }
  #ui label { color:var(--mute); white-space:nowrap; }
  #ui input[type=range] { width:100%; min-width:0; }
  #ui output { font-variant-numeric:tabular-nums; min-width:3.5em; text-align:right; }
  #ui .row { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 12px; }
  #ui .row label { color:var(--ink); }
  #hide { position:fixed; top:8px; right:8px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  body.noui #ui { display:none; }
  body.cap #hide { display:none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="hide" type="button">UI</button>
<div id="ui">
  <label for="t">t (giây)</label><input id="t" type="range" min="0" max="30" step="0.02" value="0"><output id="to">0</output>
  <label for="wind">gió ×</label><input id="wind" type="range" min="0" max="2" step="0.05" value="1"><output id="windo">1</output>
  <label for="dir">hướng °</label><input id="dir" type="range" min="0" max="360" step="5" value="20"><output id="diro">20</output>
  <label for="gust">giật</label><input id="gust" type="range" min="0" max="1" step="0.05" value="0.8"><output id="gusto">0.8</output>
  <div class="row"><button id="play" type="button" style="font:inherit;padding:2px 12px;margin-right:12px">▶ Chạy</button><label><input type="checkbox" id="grass" checked> cỏ</label><label><input type="checkbox" id="sway" checked> cây đung đưa</label></div>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script type="module">
// sway-lab — 3 cây dừa (engine/coconut.js) + cỏ (engine/grass.js) cùng 1 GIÓ (engine/wind.js); cây xoay trên CPU (engine/sway.js). ?sway=0 tắt đung đưa.
//   ?t=2.5  thời điểm · ?wind=0..2  nhân tốc độ gió (5 m/s × wind) · ?dir=độ  hướng gió (0 = +X, 90 = +Z)
//   ?gust=0..1  độ giật · ?density=1  mật độ lúc tạo · ?grass=0  tắt cỏ · ?seed=3 · ?gsize=16 cỡ dải gió (m) · ?ui=0  ẩn bảng · ?cam=low|high
// TẤT ĐỊNH: thời gian chỉ từ thanh trượt / ?t / window.renderAt(t) (tools/look.mjs). Không rAF, không đồng hồ, không Math.random.
import * as THREE from 'three';
import { createWind } from './wind.js';
import { createGrass } from './grass.js';
import { createSway } from './sway.js';
import { createCoconutPalm } from './coconut.js';

window.THREE = THREE;
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const on = (k, d = true) => (q.has(k) ? q.get(k) !== '0' : d);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
if (!on('ui')) document.body.classList.add('noui', 'cap');
$('hide').onclick = () => document.body.classList.toggle('noui');

const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const SKY = new THREE.Color('#a9cdf0');
scene.background = SKY; scene.fog = new THREE.Fog('#bcd6ee', 30, 110);
const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.05, 400);
const SUN = new THREE.Vector3(0.45, 0.5, -0.75).normalize();
const hemi = new THREE.HemisphereLight('#b8d4f0', '#4a6a35', 2.2);
const sun = new THREE.DirectionalLight('#fff0d4', 2.4); sun.position.copy(SUN).multiplyScalar(50);
scene.add(hemi, sun);

// nền đất + đồi xa (không phải cỏ) để thấy đường chân trời
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#35602a', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.name = 'ground'; scene.add(ground);

// vật làm thước: người khối R6 (cao ~1.8 m) + hộp
const M = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
const dummy = new THREE.Group(); dummy.name = 'scale_dummy';
const bx = (w, h, d, c, x, y, z, n) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y, z); m.name = n; dummy.add(m); };
bx(0.5, 0.8, 0.28, '#e74c3c', 0, 1.1, 0, 'torso'); bx(0.35, 0.35, 0.35, '#f1c27d', 0, 1.68, 0, 'head');
bx(0.24, 0.7, 0.24, '#2c3e8c', -0.13, 0.35, 0, 'legL'); bx(0.24, 0.7, 0.24, '#2c3e8c', 0.13, 0.35, 0, 'legR');
dummy.position.set(-1.6, 0, -2); dummy.rotation.y = 0.5; scene.add(dummy);
const walker = dummy.clone(); walker.name = 'walker'; walker.rotation.y = Math.PI / 2; scene.add(walker);   // đi theo +X; chân ở z cục bộ-> sau xoay: trục chân = z thế giới
const crate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), M('#b07a3e')); crate.position.set(2.2, 0.4, -5); crate.rotation.y = 0.6; crate.name = 'crate'; scene.add(crate);

// ---- gió + cỏ (tạo 1 lần; mọi thứ sau đó là hàm thuần của t) ----
const WIND0 = 5;
const wind = createWind(THREE, { dir: [1, 0], speed: WIND0, gust: 0.8, seed: num('seed', 3), gustSize: num('gsize', 16) });
const grass = on('grass') ? createGrass(THREE, {
  wind, area: { center: [0, 0], size: 30 }, cell: 0.08, height: 0.38, seed: num('seed', 3), density: num('density', 1),
  colors: { base: '#3f7d2f', tip: '#9fd36a' }, follow: true,
}) : null;
if (grass) {
  grass.set({ sunDir: SUN, sunColor: new THREE.Color('#fff0d4').multiplyScalar(1.5), skyColor: new THREE.Color('#9fc4ee') });
  scene.add(grass.group);
}

// 3 cây dừa (h≈4 m, đứng gần camera) — đung đưa bằng engine/sway.js (CPU, không shader mới)
const palms = [[-2.6, -7, 1], [0.4, -10, 5], [2.8, -6, 9]].map(([x, z, sd]) => {
  const p = createCoconutPalm(THREE, { h: 4.2 + sd * 0.1, lean: 0.12, seed: sd }); p.position.set(x, 0, z); scene.add(p); return p;
});
const sway = createSway(THREE, wind, { seed: num('seed', 3) });
for (const p of palms) sway.addPalm(p);

const CAMS = { low: { p: [0, 1.6, 7], l: [0, 2.4, -6] }, high: { p: [0, 3.2, 15], l: [0, 1.5, -4] } };
function renderAt(tIn) {
  const t = +tIn;
  const speed = WIND0 * +$('wind').value, dir = +$('dir').value;
  wind.set({ dir, speed, gust: +$('gust').value });   // số = độ
  const c = CAMS[q.get('cam')] || CAMS.low;
  camera.position.set(...c.p); camera.lookAt(...c.l); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  // người khối đi thẳng qua ruộng: x = -6 + 1.2 t (mod 12), hàm thuần của t; 2 bàn chân + thân nạp setPushers  (?push=0 tắt)
  const wx = -6 + ((1.2 * t) % 12), wz = 6, ph = t * 6;
  walker.position.set(wx, 0, wz);
  walker.children[2].position.y = 0.35 + Math.max(0, Math.sin(ph)) * 0.12; walker.children[3].position.y = 0.35 + Math.max(0, -Math.sin(ph)) * 0.12;
  if (grass) grass.setPushers(on('push') ? [
    { x: wx, y: Math.max(0, Math.sin(ph)) * 0.12, z: wz + 0.13, r: 0.5 }, { x: wx, y: Math.max(0, -Math.sin(ph)) * 0.12, z: wz - 0.13, r: 0.5 },
    { x: wx, y: 0.8, z: wz, r: 0.7 }] : []);
  if (grass) { grass.group.visible = $('grass').checked; grass.update(t, camera); } else wind.update(t);
  if ($('sway').checked) sway.update(t); else sway.rest();
  renderer.render(scene, camera);
  $('to').textContent = t.toFixed(2); $('windo').textContent = (+$('wind').value).toFixed(2); $('diro').textContent = dir; $('gusto').textContent = (+$('gust').value).toFixed(2);
}

const setIf = (id, k) => { if (q.has(k)) { const el = $(id); if (el.type === 'checkbox') el.checked = q.get(k) !== '0'; else el.value = q.get(k); } };
setIf('t', 't'); setIf('wind', 'wind'); setIf('dir', 'dir'); setIf('gust', 'gust'); setIf('grass', 'grass'); setIf('sway', 'sway');
for (const el of document.querySelectorAll('#ui input')) el.addEventListener('input', () => renderAt(+$('t').value));
window.renderAt = (t) => { $('t').value = t; renderAt(t); };
// ▶ Chạy: chỉ để XEM — đồng hồ thật chỉ đẩy thanh t; hình vẫn là hàm thuần của t (look.mjs không bấm nút này)
let playing = false, t0 = 0, w0 = 0;
const tick = (now) => { if (!playing) return; const t = (w0 + (now - t0) / 1000) % 30; $('t').value = t; renderAt(t); requestAnimationFrame(tick); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Dừng' : '▶ Chạy'; if (playing) { t0 = performance.now(); w0 = +$('t').value; requestAnimationFrame(tick); } };
window.__shots = null; window.__stage = { renderer, scene, camera };
renderAt(+$('t').value);
window.__ready = true;
</script>
</body>
</html>
