<!doctype html>
<!-- ga-lab — trang DUYỆT nhân vật chính "Gà" v2 (engine/ga-rig.js: khung riêng theo ảnh phác) so với v1 (r15 + tuỳ chọn) và với ảnh phác.
       Kéo chuột / vuốt để xoay, cuộn / chụm để zoom. Nút: góc nhìn, chuyển động, 37 biểu cảm, v1 / v2 / cạnh nhau, ảnh phác mờ phía sau.
       Gộp 1 file (file://, điện thoại): node tools/ga-lab-build.mjs → dist/ga-lab.html
       Query: ?view=front|tq|side|tqb|back|face &hood=0 (mũ cũ) &anim=ref|idle|walk|run|sit|wave|scared|cheer &face=quyet_tam &mode=v2|v1|both|old &sk=0.5 (độ mờ ảnh phác) &t=0.3 &pw=1
              &ortho=1 (camera trực giao khớp ảnh phác 1028×1530, nền phẳng, ẩn UI — để đo silhouette)  &flat=1 (vật liệu không đổ bóng)
       Bề mặt kiểm: window.__ready, window.renderAt(t), window.__set({view, anim, face, mode, sk}).
       TẤT ĐỊNH: hình tại t chỉ phụ thuộc (t, anim, face); rAF chỉ dùng để xem tương tác, không dùng khi chụp (static=1). -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gà Lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfcad6; font: 14px/1.3 system-ui, "Segoe UI", sans-serif; color: #222; touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sk { position: fixed; pointer-events: none; display: none; opacity: .5; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 6px 10px; background: rgba(255,255,255,.75); font-weight: 600; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(6px); }
  #bar small { font-weight: 400; color: #555; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow-y: auto; background: rgba(255,255,255,.88); padding: 6px 8px 10px; backdrop-filter: blur(8px); touch-action: pan-y; border-radius: 12px 12px 0 0; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; align-items: center; }
  .row b { font-size: 12px; color: #666; min-width: 62px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; color: #222; }
  button.on { background: #2b7a3d; color: #fff; border-color: #2b7a3d; }
  #faces button { padding: 5px 7px; font-size: 12px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<img id="sk" alt="">
<div id="bar"><span>Nhân vật chính “Gà” — bản duyệt v2</span><small id="info"></small></div>
<div id="panel">
  <div class="row"><b>Góc nhìn</b><span id="views"></span></div>
  <div class="row"><b>Chuyển động</b><span id="anims"></span><button id="play">Dừng</button></div>
  <div class="row"><b>Bản</b><span id="modes"></span><button id="skb">Ảnh phác mờ</button></div>
  <div class="row"><b>Biểu cảm</b></div>
  <div class="row" id="faces"></div>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { createR15, loadR15Body, loadGaFaces, GA_FACES } from './r15.js';
import { HERO_GA } from './ga.js';
import { createGa, loadGaAtlas, loadGaHood } from './ga-rig.js';
import { GA_DIMS } from './ga-dims.js';

window.THREE = THREE;
const q = new URLSearchParams(location.search);
const A = window.__GA_ASSETS || null;   // bản gộp 1 file nhúng sẵn { body, atlas, faces:{tên:dataURL}, front, back }
const ORTHO = q.get('ortho') === '1', FLAT = q.get('flat') === '1';
const LABEL = { binh_thuong: 'Bình thường', o_tho: 'Ơ thờ', cuoi_rang_tho: 'Cười răng thỏ', cuoi_ra_nuoc_mat: 'Cười ra nước mắt', phan_khich: 'Phấn khích',
  nan_ni_moi_vien_den: 'Nằn nì', buon_rung_rung: 'Buồn rưng rưng', khoc_oa: 'Khóc oà', que_do_mat: 'Quê đỏ mặt', ren_do_mo_hoi: 'Rén đổ mồ hôi', hoang_so: 'Hoảng sợ',
  soc_ha_hoc: 'Sốc há hốc', la_het: 'La hét', met_moi: 'Mệt mỏi', nghien_rang_tuc_gian: 'Tức giận', quat: 'Quát', nghi_ngo: 'Nghi ngờ', boi_roi: 'Bối rối',
  cuoi_dac_y: 'Cười đắc ý', ghe_tom: 'Ghê tởm', cuoi_guong: 'Cười gượng', kiet_suc: 'Kiệt sức', ngo_ngac: 'Ngơ ngác', buon_ngu: 'Buồn ngủ', quyet_tam: 'Quyết tâm',
  thac_mac: 'Thắc mắc', ngam_nghi: 'Ngẫm nghĩ', thiet_ha: 'Thiệt hại', a_ra_roi: 'À ra rồi', hoi_loi: 'Hối lỗi', dao_mat: 'Đảo mắt', ban_tin_ban_nghi: 'Bán tín bán nghi',
  nhin_cuoi: 'Nhìn cười', im_lang_kho_xu: 'Im lặng khó xử', thi_tham: 'Thì thầm', tho_phao: 'Thở phào', nhay_mat: 'Nháy mắt' };

if (q.get('ui') === '0' || ORTHO) for (const id of ['bar', 'panel']) document.getElementById(id).style.display = 'none';
const cv = document.getElementById('cv'), sk = document.getElementById('sk');
const IW = GA_DIMS.image[0], IH = GA_DIMS.image[1], SP = GA_DIMS.stud_per_px, SOLE = GA_DIMS.sole_bottom_px;
if (ORTHO) cv.style.cssText = `position:fixed;left:0;top:0;width:${IW}px;height:${IH}px`;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !ORTHO, preserveDrawingBuffer: true });
renderer.setPixelRatio(ORTHO ? 1 : Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = !ORTHO; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(ORTHO ? '#dbd2db' : '#cfcad6');
scene.add(new THREE.HemisphereLight('#ffffff', '#b8b0c4', 1.15));
const sun = new THREE.DirectionalLight('#fff4e0', 2.1); sun.position.set(5, 11, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 9, bottom: -3, near: 1, far: 40 }); scene.add(sun);
const fill = new THREE.DirectionalLight('#dfe6ff', 0.7); fill.position.set(-6, 4, -7); scene.add(fill);
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshStandardMaterial({ color: '#d9d5e0', roughness: 1 }));
floor.name = 'lab_floor'; floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.visible = !ORTHO; scene.add(floor);

const body = (A || !ORTHO) ? await loadR15Body(THREE, A ? A.body : '../assets/characters/r15_body.glb') : null;
const faceSet = await loadGaFaces(THREE, A ? { urls: A.faces } : { base: '../assets/characters/ga/faces' });
const atlas = await loadGaAtlas(THREE, { url: A ? A.atlas : '../assets/characters/ga/atlas.webp' });
window.__dbg = { THREE, scene };
const hood = await loadGaHood(THREE, { url: A ? A.hood : '../assets/characters/ga/hood.glb' });   // mũ trùm Blender; ?hood=0 → mũ thủ tục cũ
const v2 = createGa(THREE, { name: 'ga2', atlas, faceSet, hood, hoodGlb: q.get('hood') !== '0', face: 'smile' });
const v1 = body ? createR15(THREE, { name: 'ga1', ...HERO_GA, body, faceSet, face: 'smile' }) : null;
scene.add(v2.root); if (v1) { scene.add(v1.root); v1.root.visible = false; }
const old = body ? createR15(THREE, { name: 'hero_old', skin: '#ecc095', shirt: '#f2c230', sleeves: '#f2c230', hoodie: '#6b4226', pants: '#3f6fb5', shoes: '#1b1b1b', hat: 'beanie', hatColor: '#d6322b', body, face: 'smile' }) : null;
if (old) { scene.add(old.root); old.root.visible = false; }
if (FLAT) scene.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshStandardMaterial && o !== floor) { const m = o.material; o.material = new THREE.MeshBasicMaterial({ map: m.map, color: m.color, transparent: m.transparent, side: m.side }); } });

const st = { view: q.get('view') || 'tq', anim: q.get('anim') || 'idle', face: q.get('face') || 'binh_thuong', mode: q.get('mode') || 'v2', sk: +(q.get('sk') || 0), playing: q.get('pw') !== '1' && !ORTHO, t: +(q.get('t') || 0) };
const VIEWS = { front: ['Trước', 0, 0.05, 1], tq: ['3/4', 0.75, 0.1, 1], side: ['Nghiêng', 1.5708, 0.05, 1], back: ['Sau', 3.1416, 0.05, 1], tqb: ['3/4 sau', 2.4, 0.1, 1], face: ['Cận mặt', 0.25, 0.02, 0] };
const cam = ORTHO ? new THREE.OrthographicCamera(-IW / 2 * SP, IW / 2 * SP, 0, 0, 0.1, 100) : new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const orb = { yaw: 0, pitch: 0.1, dist: 17, ty: 2.7, tx: 0 };
function applyView(v) {
  const [, yaw, pitch, full] = VIEWS[v]; st.view = v; orb.yaw = yaw; orb.pitch = ORTHO ? 0 : pitch;
  if (full) { orb.dist = st.mode === 'both' ? 22 : 14; orb.ty = 2.7; } else { orb.dist = 4.6; orb.ty = 4.4; }
  orb.tx = 0; if (q.get('ty')) orb.ty = +q.get('ty'); if (q.get('pitch')) orb.pitch = +q.get('pitch'); if (q.get('yaw')) orb.yaw = +q.get('yaw');   // ?ty=3.8&dist=5&pitch=.25&yaw=2.4: zoom kiểm
}
function place() {
  const both = st.mode === 'both';
  v2.root.visible = st.mode === 'v2' || both; if (v1) v1.root.visible = st.mode === 'v1' || both; if (old) old.root.visible = st.mode === 'old';
  v2.root.position.set(both ? -2.2 : 0, 0, 0); if (v1) v1.root.position.set(both ? 2.2 : 0, 0, 0);
  sk.style.display = st.sk > 0 ? 'block' : 'none'; sk.style.opacity = st.sk;
}
function frame(t) {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (ORTHO) {
    renderer.setSize(IW, IH, false); const ym = (SOLE - IH / 2) * SP; cam.top = IH / 2 * SP; cam.bottom = -IH / 2 * SP; cam.updateProjectionMatrix();
    cam.position.set(20 * Math.sin(orb.yaw), ym, 20 * Math.cos(orb.yaw)); cam.lookAt(0, ym, 0);
  } else {
    if (cv.width !== Math.round(W * renderer.getPixelRatio()) || cv.height !== Math.round(H * renderer.getPixelRatio())) { renderer.setSize(W, H, false); cam.aspect = W / H; }
    const asp = W / H, fit = asp < 0.8 ? 1 + (0.8 - asp) * 0.9 : 1;
    const d = (+q.get('dist') || orb.dist) * fit;
    cam.fov = +q.get('fov') || (st.view === 'face' ? 24 : 30); cam.updateProjectionMatrix();
    const cy = Math.cos(orb.pitch), tx = orb.tx, ty = orb.ty;
    cam.position.set(tx + d * Math.sin(orb.yaw) * cy, ty + d * Math.sin(orb.pitch), d * Math.cos(orb.yaw) * cy);
    cam.lookAt(tx, ty, 0);
  }
  for (const c of [v2, v1, old]) { if (!c) continue; if (st.anim === 'ref') c.apply({}); else c.animate(st.anim, t, { noFace: true }); }
  v2.faceAt(t, st.face); if (v1) v1.faceAt(t, st.face); if (old) old.faceAt(t, 'smile');
  renderer.render(scene, cam);
  document.getElementById('info').textContent = `${st.view} · ${st.anim} · ${st.mode} · ${LABEL[st.face] || st.face}`;
}
// ảnh phác mờ: khớp khung khi ortho; xem thường (chỉ đúng khi pitch≈0): đặt theo tỉ lệ khung nhìn
function skUpdate() {
  const src = st.view === 'back' ? (A ? A.back : '../assets/characters/ga/back.png') : (A ? A.front : '../assets/characters/ga/front.png');
  if (sk.dataset.src !== src) { sk.src = src; sk.dataset.src = src; }
  if (ORTHO) { Object.assign(sk.style, { left: '0px', top: '0px', width: IW + 'px', height: IH + 'px', zIndex: 5 }); return; }
  const W = cv.clientWidth, H = cv.clientHeight, fov = (cam.fov * Math.PI) / 180, fit = W / H < 0.8 ? 1 + (0.8 - W / H) * 0.9 : 1, d = (+q.get('dist') || orb.dist) * fit;
  const pps = H / (2 * d * Math.tan(fov / 2)), h = IH * SP * pps, w = IW * SP * pps, footY = H / 2 + orb.ty * pps;
  Object.assign(sk.style, { left: W / 2 - w / 2 + 'px', top: footY - SOLE * SP * pps + 'px', width: w + 'px', height: h + 'px', zIndex: 5 });
}
window.__lab = { THREE, scene, v2, v1, old, cam, orb, st };
const draw = () => { frame(st.t); if (st.sk > 0) skUpdate(); };
window.renderAt = (t) => { st.t = t; draw(); return true; };

// ---- UI ----
const $ = (id) => document.getElementById(id);
const mk = (par, txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; par.appendChild(b); return b; };
const vb = {}, ab = {}, fb = {}, mb = {};
function sync() { for (const k in vb) vb[k].classList.toggle('on', k === st.view); for (const k in ab) ab[k].classList.toggle('on', k === st.anim); for (const k in fb) fb[k].classList.toggle('on', k === st.face); for (const k in mb) mb[k].classList.toggle('on', k === st.mode); $('skb').classList.toggle('on', st.sk > 0); $('play').textContent = st.playing ? 'Dừng' : 'Chạy'; }
for (const k of Object.keys(VIEWS)) vb[k] = mk($('views'), VIEWS[k][0], () => { applyView(k); place(); sync(); draw(); });
for (const k of ['ref', 'idle', 'walk', 'run', 'sit', 'wave', 'scared', 'cheer']) ab[k] = mk($('anims'), k, () => { st.anim = k; sync(); draw(); });
for (const [k, l] of [['v2', 'Gà v2'], ['v1', 'Gà v1'], ['both', 'v2 | v1'], ['old', 'Hero cũ']]) mb[k] = mk($('modes'), l, () => { st.mode = k; applyView(st.view); place(); sync(); draw(); });
for (const [, k] of GA_FACES) fb[k] = mk($('faces'), LABEL[k] || k, () => { st.face = k; sync(); draw(); });
$('play').onclick = () => { st.playing = !st.playing; sync(); draw(); };
$('skb').onclick = () => { st.sk = st.sk > 0 ? 0 : 0.5; place(); sync(); draw(); };
window.__set = (o = {}) => { Object.assign(st, o); if (o.view || o.mode) applyView(st.view); place(); sync(); draw(); return true; };

const ptrs = new Map(); let pinch0 = 0, dist0 = 0;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = orb.dist; } });
cv.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) { orb.yaw -= (e.clientX - p[0]) * 0.008; orb.pitch = Math.max(-0.4, Math.min(1.2, orb.pitch + (e.clientY - p[1]) * 0.006)); }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; orb.dist = Math.max(3, Math.min(40, dist0 * pinch0 / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1])))); }
  draw();
});
const up = (e) => ptrs.delete(e.pointerId);
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', (e) => { e.preventDefault(); orb.dist = Math.max(3, Math.min(40, orb.dist * Math.exp(e.deltaY * 0.001))); draw(); }, { passive: false });
window.addEventListener('resize', () => draw());

let last = 0;
function loop(ms) { requestAnimationFrame(loop); if (st.playing) { st.t += Math.min(0.05, (ms - last) / 1000); draw(); } last = ms; }   // chỉ để xem tương tác
applyView(st.view); place(); sync();
window.__ready = true; draw();
if (q.get('static') !== '1' && !ORTHO) requestAnimationFrame(loop);
</script>
</body>
</html>
