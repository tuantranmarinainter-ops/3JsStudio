<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farwoods Lab</title>
<style>
  :root { --bg:#0e1118; --panel:rgba(14,17,24,.86); --ink:#e8eef6; --mute:#9aa8bb; --line:#2a3344; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  #c { display:block; margin:0 auto; height:100vh; width:auto; aspect-ratio:9/16; max-width:100vw; }
  #ui { position:fixed; left:8px; right:8px; bottom:8px; max-width:460px; margin:0 auto; background:var(--panel); border:1px solid var(--line);
        border-radius:10px; padding:8px 10px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 8px; align-items:center; }
  #ui label { color:var(--mute); white-space:nowrap; }
  #ui input[type=range] { width:100%; min-width:0; }
  #ui output { font-variant-numeric:tabular-nums; min-width:3.5em; text-align:right; }
  #ui .row { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 12px; }
  #ui .row label { color:var(--ink); }
  #hide { position:fixed; top:8px; right:8px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  body.noui #ui { display:none; }
  body.cap #hide { display:none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="hide" type="button">UI</button>
<div id="ui">
  <label for="t">t (giây)</label><input id="t" type="range" min="0" max="30" step="0.02" value="0"><output id="to">0</output>
  <label for="wind">gió ×</label><input id="wind" type="range" min="0" max="2" step="0.05" value="1"><output id="windo">1</output>
  <div class="row"><button id="play" type="button" style="font:inherit;padding:2px 12px;margin-right:12px">▶ Chạy</button><label><input type="checkbox" id="woods" checked> rừng xa</label></div>
</div>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script type="module">
// farwoods-lab — trang thử RỪNG XA thẻ vẽ tay (engine/farwoods.js). Không sửa file engine nào khác.
//   ?t=2.5 · ?wind=0..2 · ?count=3000 · ?rin=80 · ?rout=220 · ?seed=5 · ?cam=low|high|mid · ?woods=0 tắt · ?kinds=leafy,pine,palm · ?ui=0
// TẤT ĐỊNH: thời gian chỉ từ thanh trượt / ?t / window.renderAt(t). rAF chỉ trong nút ▶ Chạy (đẩy thanh t).
import * as THREE from 'three';
import { createWind } from './wind.js';
import { createFarwoods } from './farwoods.js';

window.THREE = THREE;
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const on = (k, d = true) => (q.has(k) ? q.get(k) !== '0' : d);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
if (!on('ui')) document.body.classList.add('noui', 'cap');
$('hide').onclick = () => document.body.classList.toggle('noui');

const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const FOG = '#c4d9ee';
scene.background = new THREE.Color(FOG).lerp(new THREE.Color('#7fb0e6'), 0.0); scene.fog = new THREE.Fog(FOG, 60, 330);
const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 1200);
const SUN = new THREE.Vector3(0.45, 0.55, -0.7).normalize();
const hemi = new THREE.HemisphereLight('#b8d4f0', '#4a6a35', 2.2);
const sun = new THREE.DirectionalLight('#fff0d4', 2.4); sun.position.copy(SUN).multiplyScalar(50);
scene.add(hemi, sun, sun.target);

// đồi nhấp nhô nhẹ; cùng hàm cho mặt đất và heightAt của rừng
const hAt = (x, z) => 5 * Math.sin(x * 0.011) * Math.cos(z * 0.013) + 2.5 * Math.sin(x * 0.031 + z * 0.023);
const gg = new THREE.PlaneGeometry(1000, 1000, 200, 200); gg.rotateX(-Math.PI / 2);
const gp = gg.attributes.position; for (let i = 0; i < gp.count; i++) gp.setY(i, hAt(gp.getX(i), gp.getZ(i)) - 0.0);
gg.computeVertexNormals();
const ground = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ color: '#4a7a35', roughness: 1 })); ground.name = 'ground'; scene.add(ground);
const crate = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 1), new THREE.MeshStandardMaterial({ color: '#c0503c', roughness: 0.8 }));
crate.position.set(1.2, 0.9, -6); crate.name = 'scale_box'; scene.add(crate);

const wind = createWind(THREE, { dir: [1, 0.2], speed: 5, gust: 0.8, seed: num('seed', 3), gustSize: 40 });
const kindsQ = q.get('kinds');
const woods = on('woods') ? createFarwoods(THREE, {
  wind, seed: num('seed', 5), center: [0, 0], ring: [num('rin', 80), num('rout', 220)], count: num('count', 3000),
  heightAt: hAt, size: [9, 18], kinds: kindsQ ? kindsQ.split(',') : { leafy: 1, pine: 0.7, palm: 0.12 },
  colors: { lit: '#86b552', shade: '#2d5630', trunk: '#5b4128' }, clumps: true,
}) : null;
if (woods) { woods.lightFrom(sun, hemi); woods.fogFrom(scene.fog); scene.add(woods.group); }

const CAMS = { low: { p: [0, 1.7, 0], l: [14, 6, -150] }, mid: { p: [0, 12, 30], l: [0, 6, -150] }, high: { p: [0, 70, 60], l: [0, 0, -130] } };
function renderAt(tIn) {
  const t = +tIn;
  wind.set({ speed: 5 * +$('wind').value });
  const c = CAMS[q.get('cam')] || CAMS.low;
  camera.position.set(...c.p); camera.lookAt(...c.l); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  if (woods) { woods.group.visible = $('woods').checked; woods.update(t, camera); } else wind.update(t);
  renderer.render(scene, camera);
  $('to').textContent = t.toFixed(2); $('windo').textContent = (+$('wind').value).toFixed(2);
}
const setIf = (id, k) => { if (q.has(k)) { const el = $(id); if (el.type === 'checkbox') el.checked = q.get(k) !== '0'; else el.value = q.get(k); } };
setIf('t', 't'); setIf('wind', 'wind');
for (const el of document.querySelectorAll('#ui input')) el.addEventListener('input', () => renderAt(+$('t').value));
window.renderAt = (t) => { $('t').value = t; renderAt(t); };
let playing = false, t0 = 0, w0 = 0;
const tick = (now) => { if (!playing) return; const t = (w0 + (now - t0) / 1000) % 30; $('t').value = t; renderAt(t); requestAnimationFrame(tick); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Dừng' : '▶ Chạy'; if (playing) { t0 = performance.now(); w0 = +$('t').value; requestAnimationFrame(tick); } };
window.__shots = null; window.__stage = { renderer, scene, camera };
renderAt(+$('t').value);
window.__ready = true;
</script>
</body>
</html>
