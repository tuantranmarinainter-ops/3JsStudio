<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splash Demo</title>
<style>
  html,body { margin:0; height:100%; background:#0e1118; overflow:hidden; }
  #c { display:block; margin:0 auto; height:100vh; width:auto; aspect-ratio:9/16; max-width:100vw; }
  body.capture #c { height:auto; width:100vw; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// Cá nhà táng nhảy khỏi mặt biển → nước văng (engine/splash.js). Tất định theo t.
//   ?clip=JUMP | JUMPSPLASH | BREATHE   ?speed=0.5 (chậm lại cho giống cá voi thật)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import * as W from './winter.js';
import { findSurfaceCrossings, createSplash } from './splash.js';

window.THREE = THREE;
const params = new URLSearchParams(location.search);
if (params.has('capture')) document.body.classList.add('capture');
const CLIP = (params.get('clip') ?? 'JUMP').toUpperCase();
const SPEED = +(params.get('speed') ?? 0.55);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#a9bfd3', 0.002);
const cam = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 30000);

const sky = W.createSky(THREE, Sky, { elevation: 14, azimuth: 160, turbidity: 4, rayleigh: 1.4 });
scene.add(sky.object);
scene.environment = sky.bakeEnvironment(renderer);
const sun = new THREE.DirectionalLight('#fff1dc', 2);
sun.position.copy(sky.sunDir).multiplyScalar(100);
scene.add(sun, new THREE.HemisphereLight('#cfe3ff', '#1d3a4a', 0.7));

// Cá nhà táng: đặt sao cho mặt nước gốc (water_y_native) trùng y = 0 của cảnh
const M = (await (await fetch('../assets/manifest.json')).json()).assets.find((a) => a.id === 'sea/sperm_whale');
const gltf = await new GLTFLoader().loadAsync('../assets/' + M.file);
const whale = gltf.scene;
whale.name = 'sperm_whale';
whale.scale.setScalar(M.scale_to_m);
whale.position.y = -M.water_y_native * M.scale_to_m;
whale.rotation.y = Math.PI / 2;
scene.add(whale);
const WATER_Y = 0;

const water = W.createWater(THREE, Water, { geometry: new THREE.PlaneGeometry(3000, 3000), sunDir: sky.sunDir, color: '#123d55', size: 6, distortion: 2.2 });
water.object.position.y = WATER_Y;
scene.add(water.object);

const mixer = new THREE.AnimationMixer(whale);
const clip = gltf.animations.find((c) => c.name.toUpperCase().startsWith(CLIP + '-')) || gltf.animations[0];
const events = findSurfaceCrossings(THREE, whale, mixer, clip, WATER_Y);
console.log('CLIP', clip.name, clip.duration.toFixed(2) + 's', 'crossings', JSON.stringify(events.map((e) => ({ t: +e.time.toFixed(3), dir: e.dir, v: +e.speed.toFixed(1), x: +e.x.toFixed(1), z: +e.z.toFixed(1) }))));
mixer.clipAction(clip).play();

const splash = createSplash(THREE, { seed: 4, scale: M.length_m });
splash.setEvents(events);
scene.add(splash.object);
const PX = 1920 / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)));

// Camera thấp sát mặt nước, nhìn ngang con cá voi
cam.position.set(6, 4, 62);
cam.lookAt(-2, 13, 0);

const DURATION = clip.duration / SPEED;
function renderAt(t) {
  const ct = (t * SPEED) % clip.duration;    // thời gian trong clip (lặp)
  mixer.setTime(ct);
  splash.update(ct, clip.duration, PX);
  water.update(t);
  renderer.render(scene, cam);
}
window.renderAt = renderAt;
window.DURATION = DURATION;
addEventListener('hf-seek', (e) => renderAt(e.detail?.time ?? 0));
renderAt(+(params.get('t') ?? 0));
window.__ready = true;
</script>
</body>
</html>
