# Render một tập thành N đoạn song song (mỗi đoạn 1 máy), rồi ghép thành 1 MP4.
# Chạy: Actions → render → Run workflow (episode, parts), hoặc push file render/request.txt có dòng "ep001 10".
# Kết quả: artifact "<ep>-mp4" + nhánh "renders/<ep>" (1 commit, chứa <ep>.mp4) để phiên Claude git fetch về.
name: render

on:
  workflow_dispatch:
    inputs:
      episode: { description: "thư mục tập trong episodes/", default: "ep001" }
      parts: { description: "số đoạn song song", default: "10" }
  push:
    paths: ["render/request.txt"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ep: ${{ steps.p.outputs.ep }}
      matrix: ${{ steps.p.outputs.matrix }}
      frames: ${{ steps.p.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          EP="${{ github.event.inputs.episode }}"; N="${{ github.event.inputs.parts }}"
          if [ -z "$EP" ] && [ -f render/request.txt ]; then read EP N < <(grep -v "^#" render/request.txt | head -1); fi
          EP=${EP:-ep001}; N=${N:-10}
          # tổng frame = data-duration × fps của root composition
          python3 - "$EP" "$N" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys, math
          ep, n = sys.argv[1], int(sys.argv[2])
          h = open(f"episodes/{ep}/index.html", encoding="utf-8").read()
          dur = float(re.search(r'data-composition-id="main"[^>]*data-duration="([\d.]+)"', h).group(1))
          fps = int(re.search(r'data-fps="(\d+)"', h).group(1))
          total = round(dur * fps)
          cuts = [round(i * total / n) for i in range(n + 1)]
          parts = [{"i": i, "f0": cuts[i], "f1": cuts[i + 1], "fps": fps} for i in range(n)]
          print(f"ep={ep}"); print(f"frames={total}"); print("matrix=" + json.dumps({"include": parts}))
          PY

  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render đoạn ${{ matrix.i }} (F${{ matrix.f0 }}–F${{ matrix.f1 }})
        run: |
          S=$(python3 -c "print(${{ matrix.f0 }}/${{ matrix.fps }})")
          E=$(python3 -c "print(${{ matrix.f1 }}/${{ matrix.fps }})")
          mkdir -p out
          # registry npm đôi khi chưa đồng bộ gói phụ thuộc → thử cài lại tối đa 5 lần
          for i in 1 2 3 4 5; do npm i -g hyperframes@0.9.30 --no-audit --no-fund && break; echo "npm lỗi, thử lại sau $((i*20))s"; sleep $((i*20)); done
          npx --yes hyperframes@0.9.30 render . -c "episodes/${{ needs.plan.outputs.ep }}/index.html" \
            --start "$S" --end "$E" --workers auto --quiet -o "out/part_$(printf %02d ${{ matrix.i }}).mp4"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 out/part_*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: out/*.mp4
          retention-days: 3

  concat:
    needs: [plan, part]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "part-*", merge-multiple: true }
      - name: Trộn âm thanh (giọng + nhạc + sfx căn theo đỉnh âm, chuẩn -14 LUFS)
        run: |
          EP=${{ needs.plan.outputs.ep }}
          pip install -q numpy
          python3 tools/mix.py "$EP" --out mix.m4a | tee mix.md
          { echo "## Âm thanh"; cat mix.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ghép (video nối liền + 1 track âm thanh cả phim)
        run: |
          EP=${{ needs.plan.outputs.ep }}
          ls parts/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > list.txt; cat list.txt
          AUDIO=mix.m4a; [ -f "$AUDIO" ] || AUDIO=episodes/$EP/narration.mp3
          if [ -f "$AUDIO" ]; then
            ffmpeg -v error -y -f concat -safe 0 -i list.txt -i "$AUDIO" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "$EP.mp4"
          else
            ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart "$EP.mp4"
          fi
          N=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$EP.mp4")
          echo "frames=$N (cần ${{ needs.plan.outputs.frames }})"
          [ "$N" = "${{ needs.plan.outputs.frames }}" ] || { echo "::error::Số frame $N khác ${{ needs.plan.outputs.frames }}"; exit 1; }
      - name: Dò pop / nhảy hình (chỉ báo, không chặn)
        continue-on-error: true
        run: |
          EP=${{ needs.plan.outputs.ep }}
          python3 tools/popscan.py "$EP.mp4" --ep "$EP" --report popscan.md || true
          cat popscan.md >> "$GITHUB_STEP_SUMMARY"
          grep -E "^\| (pop|jump|flicker) " popscan.md | while read -r l; do echo "::warning::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.ep }}-mp4
          path: ${{ needs.plan.outputs.ep }}.mp4
          retention-days: 7
      - name: Đẩy lên nhánh renders/<ep> (1 commit, ghi đè)
        run: |
          EP=${{ needs.plan.outputs.ep }}
          mkdir pub && mv "$EP.mp4" pub/ && cd pub
          git init -q && git checkout -q -b "renders/$EP"
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add "$EP.mp4" && git commit -qm "render $EP ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/renders/$EP"
